<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Posts</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .post {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .post h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <h1>Posts</h1>
    <div id="posts-container"></div>

    <h2>Create New Post</h2>
    <form id="post-form">
      <label for="name">Name:</label><br />
      <input type="text" id="name" required /><br /><br />
      <label for="content">Content:</label><br />
      <textarea id="content" required></textarea><br /><br />
      <button type="submit">Create Post</button>
    </form>

    <script>
      // Получение данных о постах
      fetch("/posts")
        .then((response) => response.json())
        .then((posts) => {
          const container = document.getElementById("posts-container");
          posts.forEach((post) => {
            const postDiv = document.createElement("div");
            postDiv.classList.add("post");
            postDiv.innerHTML = `
            <h2>${post.name}</h2>
            <p>${post.contents}</p>
            <small>Created at: ${post.created_at}</small>
            <button onclick="deletePost(${post.id})">Delete</button>
            <button onclick="editPost(${post.id})">Edit</button>
          `;
            container.appendChild(postDiv);
          });
        })
        .catch((error) => {
          console.error("Error fetching posts:", error);
        });

      // Создание нового поста
      const form = document.getElementById("post-form");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const content = document.getElementById("content").value;

        const newPost = { name, contents: content, count_likes: 0 };

        fetch("/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(newPost),
        })
          .then((response) => response.json())
          .then((post) => {
            const container = document.getElementById("posts-container");
            const postDiv = document.createElement("div");
            postDiv.classList.add("post");
            postDiv.innerHTML = `
          <h2>${post.name}</h2>
          <p>${post.contents}</p>
          <small>Created at: ${post.created_at}</small>
          <button onclick="deletePost(${post.id})">Delete</button>
          <button onclick="editPost(${post.id})">Edit</button>
        `;
            container.appendChild(postDiv);

            // Очистить форму
            form.reset();
          })
          .catch((error) => {
            console.error("Error creating post:", error);
          });
      });

      // Удаление поста
      function deletePost(id) {
        fetch(`/posts/${id}`, {
          method: "DELETE",
        })
          .then((response) => response.json())
          .then((post) => {
            alert(`Post deleted: ${post.name}`);
            location.reload();
          })
          .catch((error) => {
            console.error("Error deleting post:", error);
          });
      }

      // Редактирование поста (функция будет расширена)
      function editPost(id) {
        alert("Edit functionality will be added later!");
      }
    </script>
  </body>
</html>
